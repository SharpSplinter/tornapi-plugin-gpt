name = "tornapi-plugin-gpt"
main = "worker.js"
compatibility_date = "2026-09-27"
compatibility_flags = ["global_fetch_strictly_public"]
workers_dev = true

[vars]
TORN_OPENAPI_URL = "https://www.torn.com/swagger/openapi.json"
TORN_API_BASE = "https://api.torn.com/v2"
TORN_USER_AGENT = "TornChatGPT/1.0"

# Bind a Cloudflare KV namespace named OAUTH_KV in the Workers dashboard
# before the OAuth-enabled deployment is used.
